name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate Android NDK
        run: |
          set -e
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          elif [ -n "${ANDROID_NDK_HOME:-}" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            echo "ANDROID_NDK=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          else
            curl -fsSL -o "$RUNNER_TEMP/ndk.zip" https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
            unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
            echo "ANDROID_NDK=$RUNNER_TEMP/android-ndk-r26d" >> "$GITHUB_ENV"
          fi
          echo "Using NDK at $ANDROID_NDK"

      - name: Build libresmod.so (arm64-v8a)
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libresmod-arm64-v8a
          path: build/arm64-v8a/libresmod.so
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/arm64-v8a/libresmod.so
